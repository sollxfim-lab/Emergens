<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergens DB — Leak Data Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
    <style>
        :root {
            --font-display: 'Playfair Display', serif;
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --blue-400: #60a5fa; --blue-500: #3b82f6; --blue-600: #2563eb; --blue-700: #1e40af; --blue-800: #172554;
            --blue-glow: rgba(59,130,246,0.28); --blue-glow-soft: rgba(59,130,246,0.12);
            --gold: #d4a574; --gold-light: #e7cd9f; --gold-glow: rgba(212,165,116,0.2);
            --green: #4fb488; --green-glow: rgba(79,180,136,0.2);
            --red: #f87171; --red-glow: rgba(248,113,113,0.2);
            --radius-sm: 8px; --radius-md: 12px; --radius-xl: 26px;
            --transition-fast: 180ms cubic-bezier(0.4,0,0.2,1);
            --transition-med: 340ms cubic-bezier(0.16,1,0.3,1);
            --transition-slow: 560ms cubic-bezier(0.16,1,0.3,1);
        }
        [data-theme="dark"] {
            --bg-primary: #020617; --bg-secondary: #0b1220; --bg-tertiary: #111827;
            --bg-elevated: #1e293b; --border-color: #1e293b; --border-subtle: #334155;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #64748b;
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.65); --sheen: rgba(255,255,255,0.03);
            --table-hover: rgba(59,130,246,0.06);
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-tertiary: #f1f5f9;
            --bg-elevated: #ffffff; --border-color: #cbd5e1; --border-subtle: #e2e8f0;
            --text-primary: #0f172a; --text-secondary: #334155; --text-muted: #64748b;
            --shadow-lg: 0 20px 50px rgba(30,41,59,0.1); --sheen: rgba(255,255,255,0.7);
            --table-hover: rgba(59,130,246,0.04);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:var(--font-ui);background:var(--bg-primary);color:var(--text-primary);
            transition:background var(--transition-slow),color var(--transition-slow);
            -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;position:relative;
        }
        button,input{font-family:inherit} button{cursor:pointer}
        button:focus-visible,input:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px}
        [hidden]{display:none!important}
        .bg-grid{
            position:fixed;inset:0;z-index:0;
            background-image:linear-gradient(var(--border-color) 1px,transparent 1px),linear-gradient(90deg,var(--border-color) 1px,transparent 1px);
            background-size:44px 44px;
            -webkit-mask-image:radial-gradient(ellipse 80% 60% at center,black 0%,transparent 72%);
            mask-image:radial-gradient(ellipse 80% 60% at center,black 0%,transparent 72%);
            opacity:0.45;pointer-events:none;
        }
        .bg-glow{position:fixed;z-index:0;pointer-events:none;width:600px;height:600px;border-radius:50%;filter:blur(90px);opacity:0.4}
        .bg-glow--one{top:-10%;left:5%;background:radial-gradient(circle,var(--blue-glow) 0%,transparent 60%);animation:softFloat 9s ease-in-out infinite}
        .bg-glow--two{bottom:-16%;right:4%;background:radial-gradient(circle,var(--blue-glow-soft) 0%,transparent 60%);animation:softFloat 11s ease-in-out infinite reverse}
        [data-theme="light"] .bg-glow{opacity:0.28}
        @keyframes softFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        @keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}} .spin{animation:spin 1s linear infinite}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
        @keyframes checkPop{0%{stroke-dashoffset:48;opacity:0}60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:1}}
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

        /* Header */
        .header{
            position:fixed;top:0;left:0;right:0;z-index:100;
            display:flex;align-items:center;justify-content:space-between;
            padding:14px 28px;background:var(--bg-secondary);
            border-bottom:1px solid var(--border-color);
            box-shadow:0 4px 20px rgba(0,0,0,0.2);
            backdrop-filter:blur(10px);
        }
        .header-brand{
            display:flex;align-items:center;gap:12px;cursor:pointer;
            transition:opacity var(--transition-fast);
        }
        .header-brand:hover{opacity:0.85}
        .header-brand svg{width:36px;height:36px;filter:drop-shadow(0 0 12px var(--blue-glow))}
        .header-brand-text{display:flex;flex-direction:column}
        .header-brand-text h1{
            font-family:var(--font-display);font-size:1.2rem;font-weight:800;
            letter-spacing:1.5px;color:var(--blue-400);line-height:1.1;
        }
        .header-brand-text h1 span{color:var(--gold)}
        .header-brand-text small{
            font-size:0.65rem;color:var(--text-secondary);letter-spacing:0.06em;
            font-weight:500;
        }
        .header-actions{display:flex;align-items:center;gap:14px}
        .theme-toggle{
            width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
            border-radius:50%;border:1px solid var(--border-color);background:var(--bg-tertiary);
            color:var(--text-secondary);transition:all var(--transition-med);font-size:0.95rem;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }
        .theme-toggle:hover{
            color:var(--blue-500);border-color:var(--blue-500);
            background:var(--blue-glow-soft);transform:translateY(-2px) rotate(15deg);
            box-shadow:0 0 20px var(--blue-glow);
        }

        /* Profile Dropdown */
        .profile-wrap{position:relative}
        .profile-btn{
            display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;
            background:var(--bg-tertiary);border:1px solid var(--border-color);
            border-radius:50px;cursor:pointer;transition:all var(--transition-med);
            color:var(--text-primary);
        }
        .profile-btn:hover{
            border-color:var(--blue-500);box-shadow:0 0 18px var(--blue-glow-soft);
            transform:translateY(-1px);
        }
        .profile-avatar{
            width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue-400),var(--blue-700));
            display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:#fff;
            letter-spacing:1px;flex-shrink:0;
        }
        .profile-info{display:flex;flex-direction:column;line-height:1.2;text-align:left}
        .profile-name{font-weight:600;font-size:0.82rem;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .profile-role{
            font-size:0.62rem;color:var(--text-muted);text-transform:uppercase;
            letter-spacing:0.06em;font-weight:600;
        }
        .profile-role.owner{color:var(--gold)}
        .profile-role.analyst{color:var(--blue-400)}
        .profile-caret{color:var(--text-muted);font-size:0.75rem}
        .profile-dropdown{
            position:absolute;top:calc(100% + 10px);right:0;min-width:220px;
            background:var(--bg-secondary);border:1px solid var(--border-color);
            border-radius:var(--radius-md);box-shadow:var(--shadow-lg);
            padding:10px;z-index:110;display:none;animation:scaleIn 0.25s ease;
        }
        .profile-dropdown.open{display:block}
        .profile-dropdown::before{
            content:"";position:absolute;top:-6px;right:24px;width:12px;height:12px;
            background:var(--bg-secondary);border-left:1px solid var(--border-color);
            border-top:1px solid var(--border-color);transform:rotate(45deg);
        }
        .dropdown-header{
            padding:8px 10px;border-bottom:1px solid var(--border-subtle);margin-bottom:6px;
        }
        .dropdown-header .profile-name{font-size:0.9rem;font-weight:700}
        .dropdown-header .dropdown-email{
            font-size:0.7rem;color:var(--text-muted);margin-top:2px;
        }
        .dropdown-item{
            display:flex;align-items:center;gap:10px;width:100%;
            padding:9px 10px;border:none;background:transparent;color:var(--text-secondary);
            border-radius:var(--radius-sm);font-size:0.82rem;font-weight:500;
            transition:all var(--transition-fast);text-align:left;
        }
        .dropdown-item i{width:18px;text-align:center}
        .dropdown-item:hover{background:var(--blue-glow-soft);color:var(--blue-400)}
        .dropdown-item.danger:hover{background:var(--red-glow);color:var(--red)}
        .dropdown-divider{height:1px;background:var(--border-subtle);margin:4px 0}

        /* Main content */
        .main-container{
            position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:center;
            min-height:100vh;padding:110px 24px 40px;
        }
        .search-card{
            width:100%;max-width:920px;background:var(--bg-secondary);
            border:1px solid var(--border-color);border-radius:var(--radius-xl);
            padding:32px 30px;box-shadow:var(--shadow-lg);
            animation:fadeSlideUp 0.6s var(--transition-slow) both;
        }
        .search-card::before{
            content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
            background:linear-gradient(155deg,var(--blue-glow) 0%,transparent 28%,transparent 72%,var(--gold-glow) 100%);
            -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
        }

        .search-header{
            display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
            gap:12px;margin-bottom:24px;
        }
        .search-title{
            font-family:var(--font-display);font-size:1.5rem;font-weight:800;
            color:var(--text-primary);letter-spacing:0.5px;
        }
        .search-title span{color:var(--blue-400)}
        .search-badge{
            display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
            background:var(--blue-glow-soft);border:1px solid var(--blue-500);
            border-radius:20px;color:var(--blue-400);font-size:0.72rem;
            font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
        }
        .search-badge i{font-size:0.7rem}

        .search-box{
            display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
        }
        .search-input-wrap{
            flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
            background:var(--bg-tertiary);border:1px solid var(--border-color);
            border-radius:var(--radius-sm);padding:0 16px;
            transition:all var(--transition-fast);
        }
        .search-input-wrap:focus-within{
            border-color:var(--blue-500);box-shadow:0 0 0 4px var(--blue-glow-soft);
            background:var(--bg-elevated);
        }
        .search-input-wrap i{
            color:var(--text-muted);font-size:0.95rem;transition:color var(--transition-fast);
        }
        .search-input-wrap:focus-within i{color:var(--blue-500)}
        .search-input-wrap input{
            flex:1;border:none;background:transparent;color:var(--text-primary);
            padding:14px 0;font-size:0.95rem;outline:none;
        }
        .search-input-wrap input::placeholder{color:var(--text-muted)}
        .search-btn{
            display:inline-flex;align-items:center;justify-content:center;gap:8px;
            background:linear-gradient(135deg,var(--blue-400),var(--blue-700));color:#fff;
            border:none;border-radius:var(--radius-sm);padding:14px 22px;
            font-weight:600;font-size:0.9rem;cursor:pointer;
            transition:all var(--transition-med);box-shadow:0 4px 16px var(--blue-glow);
            white-space:nowrap;
        }
        .search-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px var(--blue-glow)}
        .search-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;box-shadow:none}
        .clear-btn{
            display:inline-flex;align-items:center;justify-content:center;gap:8px;
            background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);
            border-radius:var(--radius-sm);padding:14px 18px;font-weight:600;font-size:0.85rem;
            cursor:pointer;transition:all var(--transition-med);
        }
        .clear-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-glow)}

        .search-meta{
            display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
            flex-wrap:wrap;gap:8px;
        }
        .result-count{
            font-size:0.8rem;color:var(--text-muted);
            display:inline-flex;align-items:center;gap:8px;
        }
        .result-count strong{color:var(--text-primary)}
        .result-count .count-pill{
            padding:4px 10px;border-radius:14px;background:var(--blue-glow-soft);
            color:var(--blue-400);font-weight:700;font-size:0.75rem;border:1px solid var(--blue-500);
        }
        .search-status{
            font-size:0.72rem;color:var(--text-muted);font-style:italic;
        }

        .results-area{position:relative;min-height:260px}
        .loading-state{
            position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:14px;color:var(--text-muted);z-index:5;background:var(--bg-secondary);border-radius:var(--radius-md);
        }
        .loading-spinner{
            width:36px;height:36px;border:3px solid var(--border-subtle);
            border-top-color:var(--blue-500);border-radius:50%;animation:spin 0.9s linear infinite;
        }
        .loading-text{font-size:0.85rem;letter-spacing:0.05em}
        .empty-state{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:12px;padding:50px 20px;color:var(--text-muted);text-align:center;
        }
        .empty-state i{font-size:2rem;color:var(--blue-500);opacity:0.8}
        .empty-state p{font-size:0.88rem;max-width:300px;line-height:1.5}
        .error-state{
            display:flex;align-items:center;justify-content:center;gap:12px;
            padding:20px;color:var(--red);background:var(--red-glow);
            border:1px solid var(--red);border-radius:var(--radius-md);
            font-size:0.88rem;margin:20px 0;
        }

        .table-wrap{overflow-x:auto;border:1px solid var(--border-color);border-radius:var(--radius-md)}
        table{width:100%;border-collapse:collapse;min-width:640px}
        thead th{
            font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;
            padding:12px 14px;text-align:left;color:var(--text-secondary);
            background:var(--bg-tertiary);border-bottom:1px solid var(--border-color);
            font-weight:700;white-space:nowrap;
        }
        tbody td{
            padding:12px 14px;font-size:0.85rem;border-bottom:1px solid var(--border-subtle);
            color:var(--text-primary);transition:background var(--transition-fast);
            vertical-align:middle;
        }
        tbody tr:last-child td{border-bottom:none}
        tbody tr:hover{background:var(--table-hover)}
        tbody tr{cursor:default}
        .mono{font-family:var(--font-mono);font-size:0.8rem}
        .name-cell{font-weight:600;color:var(--text-primary)}
        .ic-cell{letter-spacing:0.04em}
        .class-badge{
            display:inline-block;padding:3px 8px;background:var(--blue-glow-soft);
            color:var(--blue-400);border-radius:4px;font-size:0.72rem;font-weight:700;
        }
        .teacher-cell{color:var(--text-secondary);font-size:0.8rem}
        .school-cell{color:var(--text-muted);font-size:0.78rem}

        /* Session overlay */
        .session-overlay{
            position:fixed;inset:0;background:var(--bg-primary);z-index:300;
            display:flex;align-items:center;justify-content:center;
            transition:opacity var(--transition-med),visibility var(--transition-med);
        }
        .session-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
        .session-card{
            background:var(--bg-secondary);border:1px solid var(--border-color);
            border-radius:var(--radius-xl);padding:34px 30px;width:90%;max-width:360px;
            text-align:center;box-shadow:var(--shadow-lg);
            display:flex;flex-direction:column;align-items:center;gap:18px;
        }
        .session-icon{
            width:70px;height:70px;display:flex;align-items:center;justify-content:center;
        }
        .session-icon .checkmark{
            width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            background:var(--green-glow);color:var(--green);
            border:2px solid var(--green);animation:scaleIn 0.4s ease;
        }
        .session-title{font-family:var(--font-display);font-size:1.3rem;font-weight:800;color:var(--text-primary)}
        .session-sub{font-size:0.8rem;color:var(--text-muted)}
        .session-loader{
            width:42px;height:42px;border:3px solid var(--border-subtle);
            border-top-color:var(--blue-500);border-radius:50%;animation:spin 0.9s linear infinite;
        }

        @media(max-width:600px){
            .header{padding:10px 14px}
            .header-brand-text h1{font-size:1rem}
            .header-brand svg{width:28px;height:28px}
            .profile-name{max-width:80px;font-size:0.75rem}
            .search-card{padding:20px 16px;border-radius:20px}
            .search-title{font-size:1.2rem}
            .search-btn{padding:12px 16px;font-size:0.8rem}
            .search-input-wrap input{padding:12px 0;font-size:0.88rem}
            .profile-btn{padding:4px 8px 4px 4px}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--one"></div>
    <div class="bg-glow bg-glow--two"></div>

    <!-- Session Verification Overlay -->
    <div class="session-overlay" id="sessionOverlay">
        <div class="session-card" id="sessionCard">
            <div class="session-icon" id="sessionIcon">
                <div class="session-loader" id="sessionLoader"></div>
            </div>
            <div class="session-title" id="sessionTitle">Verifying Session</div>
            <div class="session-sub" id="sessionSub">Checking your credentials securely...</div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-brand" onclick="window.location.href='/dashboard.html'">
            <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="boltGradHeader" x1="0" y1="0" x2="60" y2="60">
                        <stop offset="0" stop-color="#60a5fa"/>
                        <stop offset="1" stop-color="#1e40af"/>
                    </linearGradient>
                </defs>
                <path d="M33 4L14 34h11l-4 22 22-30H32l5-22z" fill="url(#boltGradHeader)" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <div class="header-brand-text">
                <h1>EMER<span>GENS</span></h1>
                <small>Leak Data Search</small>
            </div>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
            <div class="profile-wrap">
                <button class="profile-btn" id="profileBtn">
                    <div class="profile-avatar" id="profileAvatar">...</div>
                    <div class="profile-info">
                        <span class="profile-name" id="profileName">Loading...</span>
                        <span class="profile-role" id="profileRole">...</span>
                    </div>
                    <i class="fas fa-chevron-down profile-caret"></i>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <div class="profile-name" id="dropdownName">...</div>
                        <div class="dropdown-email" id="dropdownRole">...</div>
                    </div>
                    <button class="dropdown-item" onclick="window.location.href='/dashboard.html'">
                        <i class="fas fa-gauge-high"></i> Dashboard
                    </button>
                    <button class="dropdown-item" onclick="window.location.href='/Emergens_osint.html'">
                        <i class="fas fa-globe"></i> OSINT Panel
                    </button>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item danger" id="logoutBtn">
                        <i class="fas fa-right-from-bracket"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="main-container" id="mainContent" hidden>
        <div class="search-card">
            <div class="search-header">
                <div class="search-title">Leak <span>Data Search</span></div>
                <div class="search-badge"><i class="fas fa-database"></i> userdata</div>
            </div>

            <div class="search-box">
                <div class="search-input-wrap" id="searchInputWrap">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search by name, IC, class, or student no..." autocomplete="off">
                </div>
                <button class="search-btn" id="searchBtn">
                    <span>Search</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <button class="clear-btn" id="clearBtn" title="Clear search">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>

            <div class="search-meta">
                <div class="result-count" id="resultCount" hidden>
                    <span>Results:</span>
                    <span class="count-pill" id="countPill">0</span>
                    <span id="resultLabel">matches</span>
                </div>
                <div class="search-status" id="searchStatus">Enter a query to begin searching</div>
            </div>

            <div class="results-area" id="resultsArea">
                <div class="empty-state">
                    <i class="fas fa-user-secret"></i>
                    <p>Type a name, IC number, class, or student number and press search. Results will appear here.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ===== Theme =====
        (function(){
            const r = document.documentElement;
            const s = localStorage.getItem('emergens-theme') || 'dark';
            r.setAttribute('data-theme', s);
            function updateIcon(){
                const b = document.getElementById('themeToggle');
                b.querySelector('i').className = r.getAttribute('data-theme') === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            }
            document.getElementById('themeToggle').addEventListener('click', () => {
                const n = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                r.setAttribute('data-theme', n);
                localStorage.setItem('emergens-theme', n);
                updateIcon();
            });
            updateIcon();
        })();

        // ===== Profile Dropdown =====
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('open');
        });

        document.addEventListener('click', () => {
            profileDropdown.classList.remove('open');
        });

        profileDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // ===== Session Verification =====
        async function verifySession() {
            const overlay = document.getElementById('sessionOverlay');
            const loader = document.getElementById('sessionLoader');
            const icon = document.getElementById('sessionIcon');
            const title = document.getElementById('sessionTitle');
            const sub = document.getElementById('sessionSub');
            const main = document.getElementById('mainContent');

            try {
                const resp = await fetch('/api/me', {
                    headers: { 'Accept': 'application/json' }
                });

                if (resp.ok) {
                    const data = await resp.json();
                    const username = data.username || 'user';
                    const role = data.role || 'owner';

                    updateProfileUI(username, role);

                    // Show success animation
                    loader.style.display = 'none';
                    icon.innerHTML = '<div class="checkmark"><i class="fas fa-check" style="font-size:1.5rem;"></i></div>';
                    title.textContent = 'Session Verified';
                    sub.textContent = 'Welcome back, ' + username;
                    await new Promise(resolve => setTimeout(resolve, 1200));
                    overlay.classList.add('hidden');
                    main.hidden = false;
                } else {
                    window.location.href = '/login.html?next=/Emergens_DB.html';
                }
            } catch (err) {
                window.location.href = '/login.html?next=/Emergens_DB.html';
            }
        }

        function updateProfileUI(username, role) {
            const initial = username.charAt(0).toUpperCase();
            const roleText = role.charAt(0).toUpperCase() + role.slice(1);
            document.getElementById('profileAvatar').textContent = initial;
            document.getElementById('profileName').textContent = username;
            document.getElementById('profileRole').textContent = roleText;
            document.getElementById('profileRole').className = 'profile-role ' + role.toLowerCase();
            document.getElementById('dropdownName').textContent = username;
            document.getElementById('dropdownRole').textContent = roleText;
        }

        // ===== Search =====
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultsArea = document.getElementById('resultsArea');
        const resultCount = document.getElementById('resultCount');
        const countPill = document.getElementById('countPill');
        const resultLabel = document.getElementById('resultLabel');
        const searchStatus = document.getElementById('searchStatus');

        searchBtn.addEventListener('click', performSearch);
        clearBtn.addEventListener('click', clearSearch);

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        function clearSearch() {
            searchInput.value = '';
            resultsArea.innerHTML = '<div class="empty-state"><i class="fas fa-user-secret"></i><p>Type a name, IC number, class, or student number and press search. Results will appear here.</p></div>';
            resultCount.hidden = true;
            searchStatus.textContent = 'Enter a query to begin searching';
            searchInput.focus();
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                showEmptyState('Please enter a search query.');
                return;
            }

            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fas fa-spinner spin"></i><span>Searching...</span>';
            searchStatus.textContent = 'Searching records...';
            resultsArea.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Searching userdata...</div>
                </div>
            `;
            resultCount.hidden = true;

            try {
                const resp = await fetch('/api/leakdata/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: query })
                });

                if (resp.status === 401) {
                    window.location.href = '/login.html?next=/Emergens_DB.html';
                    return;
                }

                const data = await resp.json();
                if (!resp.ok) {
                    showError(data.error || 'Search failed. Please try again.');
                    return;
                }

                const results = data.data?.results || [];
                const count = data.data?.count || 0;

                if (count === 0) {
                    showEmptyState('No records found for "' + query + '". Try different keywords.');
                } else {
                    renderResults(results, count);
                }

                searchStatus.textContent = 'Search completed for "' + query + '"';
            } catch (err) {
                showError('Could not reach the server. Please check your connection.');
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<span>Search</span><i class="fas fa-arrow-right"></i>';
            }
        }

        function showEmptyState(message) {
            resultsArea.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-user-secret"></i>
                    <p>${message}</p>
                </div>
            `;
            resultCount.hidden = true;
        }

        function showError(message) {
            resultsArea.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-triangle-exclamation"></i>
                    <span>${message}</span>
                </div>
            `;
            resultCount.hidden = true;
        }

        function renderResults(results, count) {
            resultCount.hidden = false;
            countPill.textContent = count;
            resultLabel.textContent = count === 1 ? 'match' : 'matches';

            let rows = '';
            results.forEach((rec) => {
                const no = rec.no ?? '';
                const name = rec.nama_penuh ?? rec.name ?? '';
                const ic = rec.ic ?? '';
                const className = rec.class_name ?? rec.className ?? '';
                const teacher = rec.teacher ?? '';
                const schoolName = rec.school_name ?? rec.school ?? '';
                const year = rec.year ?? '';

                rows += `
                    <tr>
                        <td class="mono">${no}</td>
                        <td class="name-cell">${escapeHtml(name)}</td>
                        <td class="mono ic-cell">${escapeHtml(ic)}</td>
                        <td><span class="class-badge">${escapeHtml(className)}</span></td>
                        <td class="teacher-cell">${escapeHtml(teacher)}</td>
                        <td class="school-cell">${escapeHtml(schoolName)}</td>
                        <td class="school-cell">${escapeHtml(year)}</td>
                    </tr>
                `;
            });

            resultsArea.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Name</th>
                                <th>IC Number</th>
                                <th>Class</th>
                                <th>Teacher</th>
                                <th>School</th>
                                <th>Year</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Logout =====
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (err) {
                // ignore
            }
            window.location.href = '/login.html';
        });

        // ===== Init =====
        verifySession();
    </script>
</body>
</html>
