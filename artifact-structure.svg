<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Emergens artifact structure</title>
  <desc id="desc">Architecture diagram showing security tester, policy and API layers, access control, scan workflows, analysis assistance, and exploit repository.</desc>
  <defs>
    <style>
      .bg { fill: #e8e0eb; }
      .panel { fill: #efeaf3; stroke: #3e3e3e; stroke-width: 2; }
      .cluster { fill: #e7f0ea; stroke: #3e3e3e; stroke-width: 2; }
      .cluster2 { fill: #f4e9d7; stroke: #3e3e3e; stroke-width: 2; }
      .cluster3 { fill: #f5d8d8; stroke: #3e3e3e; stroke-width: 2; }
      .blue { fill: #dfeaf7; stroke: #3e3e3e; stroke-width: 2; }
      .green { fill: #dfeee7; stroke: #3e3e3e; stroke-width: 2; }
      .orange { fill: #f4e9d7; stroke: #3e3e3e; stroke-width: 2; }
      .red { fill: #f3dfe0; stroke: #3e3e3e; stroke-width: 2; }
      .label { font: 13px 'Segoe UI', Arial, sans-serif; fill: #2b2b2b; }
      .title { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #2b2b2b; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #2b2b2b; }
      .node-title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #2b2b2b; }
      .arrow { stroke: #3a3a3a; stroke-width: 2; fill: none; }
      .dash { stroke: #868686; stroke-dasharray: 6 6; stroke-width: 1.5; fill: none; }
      .connector { stroke: #3a3a3a; stroke-width: 2; fill: none; }
      .green-line { stroke: #1b8b4e; stroke-width: 2; fill: none; }
      .red-line { stroke: #d44c5a; stroke-width: 2; fill: none; }
      .orange-line { stroke: #d99a2f; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="960"/>

  <path class="connector" d="M80 155 L80 170 L130 170"/>
  <path class="connector" d="M80 155 L80 243 L130 243"/>
  <path class="connector" d="M80 155 L80 341 L130 341"/>

  <g>
    <circle cx="80" cy="155" r="42" class="blue"/>
    <text x="80" y="160" text-anchor="middle" class="title">Security</text>
    <text x="80" y="178" text-anchor="middle" class="title">tester</text>
  </g>

  <g>
    <text x="20" y="290" class="small">submits scans</text>
    <text x="20" y="420" class="small">streams logs</text>
    <text x="220" y="375" class="small">uses panel</text>
  </g>

  <g>
    <rect x="130" y="120" width="160" height="95" class="panel" rx="2"/>
    <text x="210" y="165" text-anchor="middle" class="node-title">Console entry</text>
    <path class="arrow" d="M290 170 H350"/>
    <path class="arrow" d="M355 170 L355 216 L290 216"/>
    <path class="arrow" d="M355 170 L355 120 L290 120"/>

    <rect x="350" y="90" width="160" height="80" class="blue" rx="2"/>
    <text x="430" y="120" text-anchor="middle" class="label">Attack panel UI</text>
    <text x="430" y="140" text-anchor="middle" class="small">[app.js]</text>

    <rect x="350" y="190" width="160" height="80" class="blue" rx="2"/>
    <text x="430" y="220" text-anchor="middle" class="label">Flask console</text>
    <text x="430" y="240" text-anchor="middle" class="small">[app.py]</text>

    <path class="arrow" d="M510 130 H560 V220 H510"/>
    <rect x="560" y="170" width="160" height="80" class="blue" rx="2"/>
    <text x="640" y="200" text-anchor="middle" class="label">Attack panel API</text>
    <text x="640" y="220" text-anchor="middle" class="small">[app.py]</text>
  </g>

  <g>
    <rect x="120" y="280" width="350" height="240" class="cluster2" rx="4"/>
    <text x="295" y="310" text-anchor="middle" class="title">Access control</text>

    <rect x="180" y="335" width="170" height="90" class="orange" rx="2"/>
    <text x="265" y="369" text-anchor="middle" class="label">Auth decorators</text>
    <text x="265" y="388" text-anchor="middle" class="small">[decorators.py]</text>

    <rect x="180" y="425" width="170" height="70" class="orange" rx="2"/>
    <text x="265" y="455" text-anchor="middle" class="label">User store</text>
    <text x="265" y="475" text-anchor="middle" class="small">[user_store.py]</text>

    <rect x="360" y="425" width="170" height="70" class="orange" rx="2"/>
    <text x="445" y="455" text-anchor="middle" class="label">Token store</text>
    <text x="445" y="475" text-anchor="middle" class="small">[token_store.py]</text>

    <path class="arrow" d="M265 430 V425"/>
    <path class="arrow" d="M445 425 V430"/>
    <path class="arrow" d="M355 380 H420"/>
    <path class="arrow" d="M180 375 H130"/>
    <path class="arrow" d="M180 462 H130"/>
    <path class="arrow" d="M530 455 H590"/>
  </g>

  <g>
    <rect x="620" y="290" width="430" height="220" class="cluster3" rx="4"/>
    <text x="835" y="318" text-anchor="middle" class="title">Analysis assistance</text>

    <rect x="710" y="346" width="210" height="80" class="red" rx="2"/>
    <text x="815" y="380" text-anchor="middle" class="label">Analytic manager</text>
    <text x="815" y="399" text-anchor="middle" class="small">[analytic_manager.py]</text>

    <rect x="980" y="346" width="210" height="80" class="red" rx="2"/>
    <text x="1085" y="380" text-anchor="middle" class="label">AI chat handler</text>
    <text x="1085" y="399" text-anchor="middle" class="small">[chat_handler.py]</text>

    <rect x="690" y="470" width="210" height="80" class="red" rx="2"/>
    <text x="795" y="504" text-anchor="middle" class="label">Exploit repository</text>
    <text x="795" y="523" text-anchor="middle" class="small">[brute_force.py]</text>

    <rect x="980" y="470" width="210" height="80" class="red" rx="2"/>
    <text x="1085" y="504" text-anchor="middle" class="label">Anthropic API</text>
    <text x="1085" y="523" text-anchor="middle" class="small">[anthropic API]</text>

    <path class="arrow" d="M920 386 H980"/>
    <path class="arrow" d="M795 426 V470"/>
    <path class="arrow" d="M1085 426 V470"/>
    <path class="arrow" d="M900 504 H980"/>
  </g>

  <g>
    <rect x="120" y="620" width="710" height="210" class="cluster" rx="4"/>
    <text x="475" y="648" text-anchor="middle" class="title">Scan workflows</text>

    <rect x="220" y="700" width="200" height="80" class="blue" rx="2"/>
    <text x="320" y="734" text-anchor="middle" class="label">Scan orchestrator</text>
    <text x="320" y="752" text-anchor="middle" class="small">[scan_orchestrator.py]</text>

    <rect x="470" y="700" width="220" height="80" class="blue" rx="2"/>
    <text x="580" y="734" text-anchor="middle" class="label">Scan history</text>
    <text x="580" y="752" text-anchor="middle" class="small">[history_store.py]</text>

    <rect x="220" y="840" width="180" height="70" class="green" rx="2"/>
    <text x="310" y="873" text-anchor="middle" class="label">Recon modules</text>
    <text x="310" y="890" text-anchor="middle" class="small">[recon.py]</text>

    <rect x="430" y="840" width="220" height="70" class="green" rx="2"/>
    <text x="540" y="873" text-anchor="middle" class="label">Web vulnerability scans</text>
    <text x="540" y="890" text-anchor="middle" class="small">[vuln_scans.py]</text>

    <path class="green-line" d="M420 740 H470"/>
    <path class="green-line" d="M320 780 V840"/>
    <path class="green-line" d="M540 780 V840"/>
  </g>

  <g>
    <rect x="760" y="620" width="600" height="210" class="cluster" rx="4"/>
    <text x="1060" y="648" text-anchor="middle" class="title">SQL injection engine</text>

    <rect x="860" y="700" width="220" height="80" class="green" rx="2"/>
    <text x="970" y="734" text-anchor="middle" class="label">SQL injection engine</text>
    <text x="970" y="752" text-anchor="middle" class="small">[sql_engine.py]</text>

    <rect x="1120" y="700" width="200" height="80" class="green" rx="2"/>
    <text x="1220" y="734" text-anchor="middle" class="label">Scanner history</text>
    <text x="1220" y="752" text-anchor="middle" class="small">[history_store.py]</text>

    <path class="green-line" d="M1080 740 H1120"/>
    <path class="green-line" d="M970 780 V835"/>
  </g>

  <g>
    <text x="330" y="265" class="small">reads users</text>
    <text x="590" y="265" class="small">checks tokens</text>
  </g>

  <g>
    <path class="connector" d="M535 200 H560"/>
    <path class="connector" d="M535 200 H540"/>
    <path class="connector" d="M540 200 V110 H760"/>
    <path class="connector" d="M760 110 H820"/>
  </g>

  <g>
    <path class="dash" d="M660 420 Q650 500 730 500"/>
    <path class="dash" d="M920 500 H970"/>
    <path class="dash" d="M520 610 V510 H690"/>
  </g>

  <g>
    <path class="connector" d="M600 740 H680 L680 582 H820"/>
    <path class="connector" d="M760 740 H820"/>
    <path class="connector" d="M1220 620 V580 H1320"/>
    <path class="connector" d="M1320 580 V520 H1520"/>
  </g>

  <g>
    <path class="arrow" d="M900 570 H900 620"/>
    <path class="arrow" d="M1190 570 H1190 620"/>
  </g>

  <g>
    <path class="connector" d="M375 520 V560 H620 V570"/>
    <path class="connector" d="M620 570 H770"/>
  </g>

  <g>
    <rect x="1380" y="720" width="120" height="40" class="blue" rx="2"/>
    <text x="1440" y="745" text-anchor="middle" class="label">FlareSolverr</text>
  </g>

  <g>
    <path class="arrow" d="M1370 740 H1260"/>
    <path class="arrow" d="M1260 740 V690 H1160"/>
  </g>
</svg>
